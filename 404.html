<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page Not Found — VS Pet Shop</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  .nf{ min-height:100vh; display:grid; place-items:center; text-align:center; padding:40px 20px; }
  .nf__code{ font-family:'Rubik',sans-serif; font-weight:800; font-size:clamp(5rem,18vw,10rem);
             line-height:1; color:var(--brand); margin:0; }
  .nf__paw{ font-size:64px; color:var(--brand-700); opacity:.35; margin-bottom:8px; }
  .nf h1{ font-size:clamp(1.5rem,4vw,2.2rem); margin:8px 0 12px; }
  .nf p{ color:var(--ink-soft); max-width:46ch; margin:0 auto 28px; }
  .nf__btns{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; }
</style>
</head>
<body>
<main class="nf">
  <div>
    <svg class="ic nf__paw" viewBox="0 0 52 52" fill="currentColor" stroke="none" aria-hidden="true">
      <ellipse cx="13" cy="19" rx="5" ry="6.4"/><ellipse cx="23" cy="13" rx="5.4" ry="6.9"/>
      <ellipse cx="34" cy="15" rx="5.4" ry="6.9"/><ellipse cx="43" cy="23" rx="4.8" ry="5.9"/>
      <path d="M26 25c7 0 13 5 13 11 0 5-3.8 8-8.6 8-2.2 0-3.2-.9-4.4-.9s-2.2.9-4.4.9c-4.8 0-8.6-3-8.6-8 0-6 6-11 13-11Z"/>
    </svg>
    <p class="nf__code">404</p>
    <h1>This page has wandered off</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back to the shop.</p>
    <div class="nf__btns">
      <a class="btn btn--primary btn--lg" href="/">Back to Home</a>
      <a class="btn btn--ghost btn--lg" href="tel:+918851203070">Call the Shop</a>
    </div>
  </div>
</main>

</html>
